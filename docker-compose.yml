name: yggmesh-exit-node
services:
  # Clearnet exit for YggMesh nodes, see exit.sh: Yggdrasil-ng routes the IPv4
  # of the nodes listed in EXIT_USERS here (Crypto-Key Routing), it leaves
  # masqueraded to the server's IP.
  exit:
    image: ghcr.io/ed-asriyan/yggmesh-exit-node:latest
    # Only "latest" is published, so always check for a newer one on "up"
    pull_policy: always
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.ip_forward=1
    environment:
      - YGG_PRIV_KEY=${YGG_PRIV_KEY:?YGG_PRIV_KEY is required}
      - YGG_PEERS=${YGG_PEERS:?YGG_PEERS is required}
      - YGG_LISTEN=${YGG_LISTEN:-}
      # Space-separated public keys of the YggMesh nodes allowed to use this exit
      - EXIT_USERS=${EXIT_USERS:?EXIT_USERS is required}
