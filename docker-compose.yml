name: yggdrasil-clearnet-proxy
services:
  yggdrasil:
    image: ghcr.io/yggdrasil-network/yggdrasil-go:latest
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      # This container owns the network namespace shared by all services,
      # forwarding is required by the NAT64 service
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
    environment:
      - YGG_PRIV_KEY=${YGG_PRIV_KEY:?YGG_PRIV_KEY is required}
      - YGG_PEERS=${YGG_PEERS:?YGG_PEERS is required}
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "Generating base config..."
        mkdir -p /etc/yggdrasil
        yggdrasil -genconf > /etc/yggdrasil/yggdrasil.conf
        
        if [ -n "$$YGG_PRIV_KEY" ]; then
          echo "Syncing YGG_PRIV_KEY..."
          sed -i "s|^\s*PrivateKey:.*|  PrivateKey: $$YGG_PRIV_KEY|g" /etc/yggdrasil/yggdrasil.conf
        fi

        cat /etc/yggdrasil/yggdrasil.conf

        if [ -n "$$YGG_PEERS" ]; then
          echo "Syncing peers from YGG_PEERS..."
          LIST=""
          for p in $$YGG_PEERS; do
            LIST="$$LIST \"$$p\","
          done
          sed -i "s|Peers:\s*\[.*\]|Peers: [$$LIST]|g" /etc/yggdrasil/yggdrasil.conf
        fi
        
        exec yggdrasil -useconffile /etc/yggdrasil/yggdrasil.conf

  # NAT64 exit for YggMesh nodes (CLEARNET_EXITS build input of YggMesh).
  # The NAT64 prefix is this node's Yggdrasil /64 subnet followed by 32 zero
  # bits: <subnet>::a.b.c.d is translated to the IPv4 address a.b.c.d.
  # Yggdrasil routes the subnet here, nothing else needs to be configured.
  nat64:
    image: debian:trixie-slim
    restart: unless-stopped
    network_mode: "service:yggdrasil"
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      # Space-separated Yggdrasil addresses (200::/8) of the YggMesh nodes allowed
      # to use this exit, through NAT64. Empty: everyone is allowed.
      - EXIT_USERS=${EXIT_USERS:-}
    depends_on:
      - yggdrasil
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        POOL="100.64.0.0/16"
        TAYGA_ADDR="100.64.0.1"
        CONF="/etc/tayga-exit.conf"

        if ! command -v tayga >/dev/null || ! command -v nft >/dev/null || ! command -v ip >/dev/null; then
          echo "Installing tayga, nftables, iproute2..."
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends tayga nftables iproute2 >/dev/null
          rm -rf /var/lib/apt/lists/*
        fi

        echo "Waiting for the Yggdrasil address..."
        ADDR=""
        while [ -z "$$ADDR" ]; do
          ADDR=$$(ip -6 -o addr show scope global | awk '{ sub(/\/.*/, "", $$4); print $$4 }' | grep -E '^2[0-9a-f][0-9a-f]:' | head -n 1 || true)
          [ -n "$$ADDR" ] || sleep 1
        done

        # Yggdrasil subnet of the address: first byte 0x02 -> 0x03, first 64 bits
        SUBNET=$$(echo "$$ADDR" | awk '
          function hex(s,    i, n) {
            n = 0
            for (i = 1; i <= length(s); i++) n = n * 16 + index("0123456789abcdef", substr(s, i, 1)) - 1
            return n
          }
          {
            n = split($$0, halves, "::")
            nh = (halves[1] == "") ? 0 : split(halves[1], h, ":")
            nt = (n == 2 && halves[2] != "") ? split(halves[2], t, ":") : 0
            for (i = 1; i <= 8; i++) g[i] = 0
            for (i = 1; i <= nh; i++) g[i] = hex(h[i])
            for (i = 1; i <= nt; i++) g[8 - nt + i] = hex(t[i])
            printf "%x:%x:%x:%x::\n", g[1] + 256, g[2], g[3], g[4]
          }')
        PREFIX="$${SUBNET}/96"

        USERS=""
        for u in $$EXIT_USERS; do
          USERS="$${USERS:+$$USERS, }$$u"
        done

        printf 'tun-device nat64\nipv4-addr %s\nprefix %s\ndynamic-pool %s\n' \
          "$$TAYGA_ADDR" "$$PREFIX" "$$POOL" > "$$CONF"
        ip link show nat64 >/dev/null 2>&1 || tayga -c "$$CONF" --mktun
        ip link set nat64 mtu 1520 up
        ip -6 route replace "$$PREFIX" dev nat64
        # The rest of the subnet is unused: do not bounce it back into Yggdrasil
        ip -6 route replace unreachable "$${SUBNET}/64"
        ip -4 route replace "$$POOL" dev nat64

        {
          echo 'table inet yggexit'
          echo 'delete table inet yggexit'
          echo 'table inet yggexit {'
          if [ -n "$$USERS" ]; then
            echo "  set users { type ipv6_addr; elements = { $$USERS } }"
          fi
          echo '  set private4 { type ipv4_addr; flags interval; elements = { 0.0.0.0/8, 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.168.0.0/16, 198.18.0.0/15, 224.0.0.0/3 } }'
          echo '  chain forward {'
          echo '    type filter hook forward priority filter; policy accept;'
          # Clients must not reach the Docker host or its networks through NAT64
          echo '    iifname "nat64" ip daddr @private4 drop'
          if [ -n "$$USERS" ]; then
            echo '    oifname "nat64" ip6 saddr != @users drop'
          fi
          echo '  }'
          if [ -n "$$USERS" ]; then
            echo '  chain input {'
            echo '    type filter hook input priority filter; policy accept;'
            echo '    meta nfproto ipv6 tcp dport 1080 ip6 saddr != @users drop'
            echo '  }'
          fi
          echo '  chain postrouting {'
          echo '    type nat hook postrouting priority srcnat; policy accept;'
          echo "    ip saddr $$POOL oifname != \"nat64\" masquerade"
          echo '  }'
          echo '}'
        } | nft -f -

        echo "Yggdrasil address: $$ADDR"
        echo "NAT64 prefix: $$PREFIX"
        if [ -n "$$USERS" ]; then
          echo "Allowed users: $$EXIT_USERS"
        else
          echo "WARNING: EXIT_USERS is empty, this exit is open to the whole Yggdrasil network"
        fi
        exec tayga -c "$$CONF" -d

volumes:
  ygg-config:
